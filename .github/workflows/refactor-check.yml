name: Refactor Check

on:
  push:
    branches:
      - refactor/account-reservation-snapshot
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Firebase public config
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          test -n "$NEXT_PUBLIC_FIREBASE_API_KEY" || (echo "NEXT_PUBLIC_FIREBASE_API_KEY is not configured." && exit 1)
          test -n "$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" || (echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN is not configured." && exit 1)
          test -n "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" || (echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID is not configured." && exit 1)
          test -n "$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" || (echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET is not configured." && exit 1)
          test -n "$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" || (echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID is not configured." && exit 1)
          test -n "$NEXT_PUBLIC_FIREBASE_APP_ID" || (echo "NEXT_PUBLIC_FIREBASE_APP_ID is not configured." && exit 1)
      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build
