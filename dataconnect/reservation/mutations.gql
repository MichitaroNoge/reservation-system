mutation CreateCustomer($name: String!, $phone: String!, $email: String!, $address: String, $firebaseUid: String)
@auth(level: NO_ACCESS) {
  customer_insert(data: {
    firebaseUid: $firebaseUid
    name: $name
    phone: $phone
    email: $email
    address: $address
  })
}

mutation UpdateCustomer($id: UUID!, $name: String!, $phone: String!, $email: String!, $address: String)
@auth(level: NO_ACCESS) {
  customer_update(key: {id: $id}, data: {
    name: $name
    phone: $phone
    email: $email
    address: $address
    updatedAt_expr: "request.time"
  })
}

mutation UpdateCustomerIdentity($id: UUID!, $name: String!, $phone: String!, $email: String!, $address: String, $firebaseUid: String)
@auth(level: NO_ACCESS) {
  customer_update(key: {id: $id}, data: {
    firebaseUid: $firebaseUid
    name: $name
    phone: $phone
    email: $email
    address: $address
    updatedAt_expr: "request.time"
  })
}

mutation DeactivateCustomer($id: UUID!)
@auth(level: NO_ACCESS) {
  customer_update(key: {id: $id}, data: {
    active: false
    updatedAt_expr: "request.time"
  })
}

mutation ReactivateCustomer($id: UUID!)
@auth(level: NO_ACCESS) {
  customer_update(key: {id: $id}, data: {
    active: true
    updatedAt_expr: "request.time"
  })
}

mutation CreateReservation(
  $reservationCode: String!
  $customerId: UUID!
  $usageDate: Date!
  $usageTime: String!
  $expectedPeople: Int!
  $status: ReservationStatus!
  $requestType: String
  $policyAgreementKind: String
  $policyAgreementAcceptedAt: Timestamp
)
@auth(level: NO_ACCESS) {
  reservation_insert(data: {
    reservationCode: $reservationCode
    customerId: $customerId
    usageDate: $usageDate
    usageTime: $usageTime
    expectedPeople: $expectedPeople
    status: $status
    requestType: $requestType
    policyAgreementKind: $policyAgreementKind
    policyAgreementAcceptedAt: $policyAgreementAcceptedAt
  })
}

