mutation CreateCustomer($name: String!, $phone: String!, $email: String!)
@auth(level: PUBLIC, insecureReason: "Guest customers can submit a reservation request.") {
  customer_insert(data: {
    name: $name
    phone: $phone
    email: $email
  })
}

mutation UpdateCustomer($id: UUID!, $name: String!, $phone: String!, $email: String!)
@auth(level: PUBLIC, insecureReason: "Prototype access until role-based Firebase Authentication is integrated.") {
  customer_update(key: {id: $id}, data: {
    name: $name
    phone: $phone
    email: $email
    updatedAt_expr: "request.time"
  })
}

mutation DeactivateCustomer($id: UUID!)
@auth(level: PUBLIC, insecureReason: "Prototype access until role-based Firebase Authentication is integrated.") {
  customer_update(key: {id: $id}, data: {
    active: false
    updatedAt_expr: "request.time"
  })
}

mutation CreateReservation(
  $reservationCode: String!
  $customerId: UUID!
  $usageDate: Date!
  $usageTime: String!
  $expectedPeople: Int!
  $status: ReservationStatus!
  $policyAgreementKind: String
  $policyAgreementAcceptedAt: Timestamp
)
@auth(level: PUBLIC, insecureReason: "Guest customers can submit a reservation request.") {
  reservation_insert(data: {
    reservationCode: $reservationCode
    customerId: $customerId
    usageDate: $usageDate
    usageTime: $usageTime
    expectedPeople: $expectedPeople
    status: $status
    policyAgreementKind: $policyAgreementKind
    policyAgreementAcceptedAt: $policyAgreementAcceptedAt
  })
}

mutation AddReservationDetail($reservationId: UUID!, $menuId: UUID!, $quantity: Int!, $unitPrice: Int!)
@auth(level: PUBLIC, insecureReason: "Used while submitting a guest reservation request.") {
  reservationDetail_insert(data: {
    reservationId: $reservationId
    menuId: $menuId
    quantity: $quantity
    unitPrice: $unitPrice
  })
}

