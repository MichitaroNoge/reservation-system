mutation RecordVisit($reservationId: UUID!, $visitedAt: Timestamp!, $actualPeople: Int!)
@auth(level: PUBLIC, insecureReason: "Prototype access until role-based Firebase Authentication is integrated.")
@transaction {
  visitRecord_insert(data: {
    reservationId: $reservationId
    visitedAt: $visitedAt
    actualPeople: $actualPeople
  })
  reservation_update(key: {id: $reservationId}, data: {
    status: VISITED
    updatedAt_expr: "request.time"
  })
}
