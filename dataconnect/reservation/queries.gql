query ListReservations @auth(level: NO_ACCESS) {
  reservations(orderBy: {receivedAt: DESC}) {
    id
    reservationCode
    usageDate
    usageTime
    status
    expectedPeople
    policyAgreementKind
    policyAgreementAcceptedAt
    confirmationContactedAt
    receivedAt
    updatedAt
    customer { id name phone email }
    reservationDetails_on_reservation {
      id
      quantity
      unitPrice
      menu { id name description standardPrice durationMinutes }
    }
    storeAssignments_on_reservation {
      id
      people
      assignedAt
      store { id name address }
    }
  }
}

query GetReservation($id: UUID!) @auth(level: NO_ACCESS) {
  reservation(key: {id: $id}) {
    id
    reservationCode
    usageDate
    usageTime
    status
    expectedPeople
    policyAgreementKind
    policyAgreementAcceptedAt
    confirmationContactedAt
    receivedAt
    updatedAt
    customer { id name phone email }
    reservationDetails_on_reservation {
      id
      quantity
      unitPrice
      menu { id name description standardPrice durationMinutes }
    }
    storeAssignments_on_reservation {
      id
      people
      assignedAt
      store { id name address }
    }
    visitRecord_on_reservation { id visitedAt actualPeople }
    billings_on_reservation { id billingType amount billingDate status }
  }
}

query GetReservationByCode($reservationCode: String!) @auth(level: NO_ACCESS) {
  reservations(where: {reservationCode: {eq: $reservationCode}}, limit: 1) {
    id
    reservationCode
    usageDate
    usageTime
    status
    expectedPeople
    policyAgreementKind
    policyAgreementAcceptedAt
    confirmationContactedAt
    receivedAt
    updatedAt
    customer { id name phone email }
    reservationDetails_on_reservation {
      id
      quantity
      unitPrice
      menu { id name description standardPrice durationMinutes }
    }
    storeAssignments_on_reservation {
      id
      people
      assignedAt
      store { id name address }
    }
  }
}

query ListCustomers @auth(level: NO_ACCESS) {
  customers(where: {active: {eq: true}}, orderBy: {createdAt: DESC}) {
    id
    name
    phone
    email
    firebaseUid
    active
    createdAt
    reservations_on_customer { id reservationCode usageDate status }
  }
}

query GetCustomerByName($name: String!) @auth(level: NO_ACCESS) {
  customers(where: {name: {eq: $name}, active: {eq: true}}, limit: 1) {
    id
    name
    phone
    email
    active
  }
}

query ListStores @auth(level: PUBLIC, insecureReason: "Stores are public booking data.") {
  stores(where: {active: {eq: true}}, orderBy: {name: ASC}) {
    id
    name
    address
    active
  }
}

query GetStoreByName($name: String!) @auth(level: PUBLIC, insecureReason: "Stores are public booking data.") {
  stores(where: {name: {eq: $name}}, limit: 1) {
    id
    name
    address
    active
  }
}

query ListMenus @auth(level: PUBLIC, insecureReason: "Menus are public booking data.") {
  menus(where: {active: {eq: true}}, orderBy: {standardPrice: ASC}) {
    id
    name
    description
    standardPrice
    durationMinutes
    active
  }
}

query GetMenuByName($name: String!) @auth(level: PUBLIC, insecureReason: "Menus are public booking data.") {
  menus(where: {name: {eq: $name}}, limit: 1) {
    id
    name
    description
    standardPrice
    durationMinutes
    active
  }
}

query ListBillingRecords @auth(level: NO_ACCESS) {
  billings(orderBy: {billingDate: DESC}) {
    id
    billingType
    amount
    billingDate
    status
    reservation { id reservationCode customer { id name } }
    invoice_on_billing { id invoiceNumber issuedAt }
  }
}
