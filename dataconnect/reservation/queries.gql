query ListReservations @auth(level: NO_ACCESS) {
  reservations(orderBy: {receivedAt: DESC}) {
    id
    reservationCode
    usageDate
    usageTime
    status
    requestType
    bookingType
    bookingContactName
    dayContactName
    dayContactPhone
    groupName
    groupNameKana
    groupType
    groupTypeOther
    expectedPeople
    policyAgreementKind
    policyAgreementAcceptedAt
    confirmationContactedAt
    receivedAt
    updatedAt
    customer { id name phone email address accountType companyBranchName contactPersonName }
    reservationDetails_on_reservation {
      id
      quantity
      unitPrice
      menu { id name description standardPrice durationMinutes displayOrder }
    }
    storeAssignments_on_reservation {
      id
      people
      assignedAt
      store { id name displayOrder }
    }
  }
}

query GetReservation($id: UUID!) @auth(level: NO_ACCESS) {
  reservation(key: {id: $id}) {
    id
    reservationCode
    usageDate
    usageTime
    status
    requestType
    bookingType
    bookingContactName
    dayContactName
    dayContactPhone
    groupName
    groupNameKana
    groupType
    groupTypeOther
    expectedPeople
    policyAgreementKind
    policyAgreementAcceptedAt
    confirmationContactedAt
    receivedAt
    updatedAt
    customer { id name phone email address accountType companyBranchName contactPersonName }
    reservationDetails_on_reservation {
      id
      quantity
      unitPrice
      menu { id name description standardPrice durationMinutes displayOrder }
    }
    storeAssignments_on_reservation {
      id
      people
      assignedAt
      store { id name displayOrder }
    }
    visitRecord_on_reservation { id visitedAt actualPeople }
    billings_on_reservation { id billingType amount billingDate status }
  }
}

query GetReservationByCode($reservationCode: String!) @auth(level: NO_ACCESS) {
  reservations(where: {reservationCode: {eq: $reservationCode}}, limit: 1) {
    id
    reservationCode
    usageDate
    usageTime
    status
    requestType
    bookingType
    bookingContactName
    dayContactName
    dayContactPhone
    groupName
    groupNameKana
    groupType
    groupTypeOther
    expectedPeople
    policyAgreementKind
    policyAgreementAcceptedAt
    confirmationContactedAt
    receivedAt
    updatedAt
    customer { id name phone email address accountType companyBranchName contactPersonName }
    reservationDetails_on_reservation {
      id
      quantity
      unitPrice
      menu { id name description standardPrice durationMinutes displayOrder }
    }
    storeAssignments_on_reservation {
      id
      people
      assignedAt
      store { id name displayOrder }
    }
  }
}

query ListReservationChangeRequests @auth(level: NO_ACCESS) {
  reservationChangeRequests(orderBy: {requestedAt: DESC}) {
    id
    requestedDate
    requestedTime
    requestedPeople
    requestedMenuItemsJson
    reason
    status
    requestedAt
    reviewedAt
    reservation {
      id
      reservationCode
      usageDate
      usageTime
      expectedPeople
      customer { id name phone email address accountType companyBranchName contactPersonName }
      reservationDetails_on_reservation {
        quantity
        menu { name }
      }
    }
  }
}

query ListCustomers @auth(level: NO_ACCESS) {
  customers(where: {active: {eq: true}}, orderBy: {createdAt: DESC}) {
    id
    name
    phone
    email
    address
    accountType
    companyBranchName
    contactPersonName
    firebaseUid
    active
    createdAt
    reservations_on_customer { id reservationCode usageDate status }
  }
}

query ListInactiveCustomers @auth(level: NO_ACCESS) {
  customers(where: {active: {eq: false}}, orderBy: {updatedAt: DESC}) {
    id
    name
    phone
    email
    address
    accountType
    companyBranchName
    contactPersonName
    firebaseUid
    active
    createdAt
    reservations_on_customer { id reservationCode usageDate status }
  }
}

query GetCustomerByName($name: String!) @auth(level: NO_ACCESS) {
  customers(where: {name: {eq: $name}, active: {eq: true}}, limit: 1) {
    id
    name
    phone
    email
    address
    accountType
    companyBranchName
    contactPersonName
    active
  }
}

query GetCustomerById($id: UUID!) @auth(level: NO_ACCESS) {
  customer(key: {id: $id}) {
    id
    name
    phone
    email
    address
    accountType
    companyBranchName
    contactPersonName
    active
  }
}

query GetCustomerByFirebaseUid($firebaseUid: String!) @auth(level: NO_ACCESS) {
