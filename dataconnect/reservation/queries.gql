query ListStores @auth(level: PUBLIC, insecureReason: "Stores are public booking data.") {
  stores(where: {active: {eq: true}}, orderBy: {displayOrder: ASC}) {
    id
    name
    displayOrder
    active
  }
}

query ListInactiveStores @auth(level: NO_ACCESS) {
