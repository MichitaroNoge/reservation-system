enum ReservationStatus {
  TEMPORARY_REQUESTED
  TEMPORARY_CONFIRMED
  TEMPORARY_REJECTED
  CONFIRMED_REQUESTED
  CONFIRMED
  CONFIRMED_REJECTED
  WAITING_FOR_VISIT
  VISITED
  CANCELLATION_REQUESTED
  CANCELLED
}

enum BillingType { USAGE CANCELLATION }
enum BillingStatus { UNBILLED INVOICED PAID VOIDED }
enum ReservationChangeRequestStatus { REQUESTED APPROVED REJECTED }

type Account @table {
  id: UUID! @default(expr: "uuidV4()")
  firebaseUid: String! @unique
  email: String! @col(dataType: "varchar(255)")
  name: String! @col(dataType: "varchar(100)")
  phone: String @col(dataType: "varchar(30)")
  address: String @col(dataType: "varchar(500)")
  accountType: String @col(dataType: "varchar(30)")
  companyBranchName: String @col(dataType: "varchar(100)")
  contactPersonName: String @col(dataType: "varchar(100)")
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Store @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @col(dataType: "varchar(100)")
  displayOrder: Int! @default(value: 0)
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Menu @table {
  id: UUID! @default(expr: "uuidV4()")
  name: String! @col(dataType: "varchar(100)")
  description: String
  standardPrice: Int!
  durationMinutes: Int!
  displayOrder: Int! @default(value: 0)
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Reservation @table {
  id: UUID! @default(expr: "uuidV4()")
  reservationCode: String! @unique @col(dataType: "varchar(30)")
  account: Account
  reserverName: String @col(dataType: "varchar(100)")
  reserverEmail: String @col(dataType: "varchar(255)")
  reserverPhone: String @col(dataType: "varchar(30)")
  reserverAddress: String @col(dataType: "varchar(500)")
  reserverAccountType: String @col(dataType: "varchar(30)")
  reserverCompanyBranchName: String @col(dataType: "varchar(100)")
  reserverContactPersonName: String @col(dataType: "varchar(100)")
  usageDate: Date!
  usageTime: String! @col(dataType: "varchar(5)")
  usageEndTime: String @col(dataType: "varchar(5)")
  status: ReservationStatus!
  requestType: String @col(dataType: "varchar(50)")
  bookingType: String @col(dataType: "varchar(30)")
  bookingContactName: String @col(dataType: "varchar(100)")
  dayContactName: String @col(dataType: "varchar(100)")
  dayContactPhone: String @col(dataType: "varchar(30)")
  groupName: String @col(dataType: "varchar(100)")
  groupNameKana: String @col(dataType: "varchar(100)")
  groupType: String @col(dataType: "varchar(100)")
  groupTypeOther: String @col(dataType: "varchar(100)")
  tcCount: Int! @default(value: 0)
  dgCount: Int! @default(value: 0)
  paymentCondition: String @col(dataType: "varchar(30)")
  remarks: String
  expectedPeople: Int!
  policyAgreementKind: String @col(dataType: "varchar(20)")
  policyAgreementAcceptedAt: Timestamp
  confirmationContactedAt: Timestamp
  receivedAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ReservationChangeRequest @table {
  id: UUID! @default(expr: "uuidV4()")
  reservation: Reservation!
  requestedDate: Date!
  requestedTime: String! @col(dataType: "varchar(5)")
  requestedPeople: Int!
  requestedMenuItemsJson: String!
  reason: String
  status: ReservationChangeRequestStatus!
  requestedAt: Timestamp! @default(expr: "request.time")
  reviewedAt: Timestamp
}

type ReservationDetail @table {
  id: UUID! @default(expr: "uuidV4()")
  reservation: Reservation!
  menu: Menu!
  quantity: Int!
  unitPrice: Int!
}

type StoreAssignment @table {
  id: UUID! @default(expr: "uuidV4()")
  reservation: Reservation!
  store: Store!
  people: Int!
  assignedAt: Timestamp! @default(expr: "request.time")
}

type VisitRecord @table {
  id: UUID! @default(expr: "uuidV4()")
  reservation: Reservation! @unique
  visitedAt: Timestamp!
  actualPeople: Int!
}

type VisitDetail @table {
  id: UUID! @default(expr: "uuidV4()")
  visitRecord: VisitRecord!
  menu: Menu!
  quantity: Int!
  unitPrice: Int!
  amount: Int!
}

type Billing @table {
  id: UUID! @default(expr: "uuidV4()")
  reservation: Reservation!
  visitDetail: VisitDetail
  billingType: BillingType!
  amount: Int!
  billingDate: Date!
  status: BillingStatus!
  createdAt: Timestamp! @default(expr: "request.time")
}

type Invoice @table {
  id: UUID! @default(expr: "uuidV4()")
  billing: Billing! @unique
  invoiceNumber: String! @unique @col(dataType: "varchar(50)")
  issuedAt: Timestamp! @default(expr: "request.time")
}
